name: Release ZeroTrace

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build portable EXE
        run: npm run build

      - name: Find generated EXE
        id: artifact
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path dist -Filter "ZeroTrace-Portable-*.exe" | Select-Object -First 1
          if (-not $file) { throw "Portable EXE not found in dist/" }
          "exe_path=$($file.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "exe_name=$($file.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerotrace-portable-exe
          path: ${{ steps.artifact.outputs.exe_path }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.exe_path }}
          generate_release_notes: true
          body: |
            ZeroTrace portable release.

            Includes:
            - ZeroTrace portable EXE (no installer)
            - Offline-ready uninstall and cleanup tooling
            - Snapshot and batch uninstall engines
